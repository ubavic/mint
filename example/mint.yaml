mint: v0.0.1
name: Example schema
author: Nikola Ubavić
version: v0.1
source:
  commands:
    - command: title
      description: Document title
      arguments:
        - name: title
          type: string
    - command: p
      description: Paragraph
      arguments:
        - name: content
      allowChildren: paragraphElements
    - command: b
      description: Bold text
      argument:
        - name: content
          type: string
    - command: link
      description: Link
      argument:
        - name: text
          type: string
        - name: url
          type: string
    - command: todo
      description: Todo comment
      argument:
        - name: content
  allowedRootChildren: blockElements
  groups:
    - name: blockElements
      commands: [p, title, todo]
    - name: paragraphElements
      commands: [link, b]
targets:
  - name: HTML
    extension: html
    commands:
      - command: title
        expression: "<h1>$1</h1>\n"
      - command: p
        expression: "<p>$1</p>\n"
      - command: b
        expression: "<bold>$1</bold>\n"
      - command: link
        expression: "<a href=\"$2\">$1</a>\n" 
      - command: todo
        expression: ""
  - name: Latex
    extension: tex
    commands:
      - command: title
        expression: "\\title{$1}\n\n"
      - command: p
        expression: "$1\n\n"
      - command: b
        expression: "\\textbf{$1}"
      - command: link
        expression: "\\href{$2}{$1}"
      - command: todo
        expression: "\n% TODO: $1\n"
